#version=RHEL9

text
cdrom

lang en_US.UTF-8
keyboard us
timezone Asia/Baku --utc

network --bootproto=dhcp --device=link --activate

rootpw --lock
user --name=packer --groups=wheel

zerombr
clearpart --all --initlabel
autopart --type=lvm

bootloader --location=mbr

firewall --enabled --service=ssh
selinux --enforcing

services --enabled="sshd,chronyd"

%packages
@^minimal-environment
openssh-server
sudo
curl
vim-minimal
chrony
dnf-plugins-core
%end

%post --log=/root/ks-post.log

echo 'packer ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer
printf 'packer:%s\n' "$(echo '${packer_password_b64}' | base64 -d)" | chpasswd
passwd --unlock packer

mkdir -p /home/packer/.ssh
chmod 700 /home/packer/.ssh

cat > /home/packer/.ssh/authorized_keys <<'EOF_KEY'
${packer_public_key}
EOF_KEY

chmod 600 /home/packer/.ssh/authorized_keys
chown -R packer:packer /home/packer/.ssh

cat > /etc/ssh/sshd_config.d/99-packer.conf <<'EOF_SSH'
PasswordAuthentication yes
KbdInteractiveAuthentication yes
UsePAM yes
PubkeyAuthentication yes
EOF_SSH

sshd -t
systemctl enable sshd
systemctl enable chronyd

# These packages may not exist on the minimal installation media.
# Install them from the enabled AlmaLinux repositories after installation.
dnf install -y cloud-init open-vm-tools wget || true

systemctl enable cloud-init 2>/dev/null || true
systemctl enable vmtoolsd 2>/dev/null || true

%end

reboot
